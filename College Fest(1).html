<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
    <link rel="stylesheet" href="College Fest(1).css">
</head>
<body>
     <section id="register">
    <h2>Student Registration</h2>

    <form>
        <label for="name">Student Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="roll">Roll Number:</label>
        <input type="text" id="roll" placeholder="Enter roll number" required>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter email" required>

        <label for="event">Select Event:</label>
        <select id="event" required>
            <option value="">Choose an event</option>
            <option>Paper Presentation</option>
            <option>Coding Competition</option>
            <option>Dance Competition</option>
            <option>Poster Designing</option>
        </select>

        <button type="submit">Submit Registration</button>
    </form>

    <p class="note">Demonstration form for the Web Development activity.</p>
</section>
</body>
</html>
